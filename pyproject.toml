[project]
name = "openmausbot-9router"
version = "0.1.0"
description = "Autonomous AI Agent Platform connecting OpenMausBot with 9Router Unified AI Gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "openai>=1.55.0,<2.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "httpx>=0.27.2,<1.0.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    "redis>=5.2.0,<6.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "pyyaml>=6.0.2,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "respx>=0.21.1,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["agent_core*", "api*", "worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
